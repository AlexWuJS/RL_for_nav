# Grid Environment Training Configuration
# 使用真实地图数据

# 训练通用配置
training:
  total_timesteps: 100000  # 总训练步数
  seed: 42  # 随机种子
  device: "auto"  # cuda 或 cpu 或 auto

  # 目录配置
  save_dir: "./training_grid_results/"  # 模型保存目录
  log_dir: "./logs_grid/"  # Monitor日志目录
  tensorboard_log: "./3_sac_grid_log/"  # TensorBoard日志目录

  # 保存频率配置
  save_freq: 10000  # 保存频率（步）
  eval_freq: 5000  # 评估频率（步）
  n_eval_episodes: 5  # 每次评估的episode数

# SAC超参数
sac:
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 100000
  gamma: 0.99  # 折扣因子
  tau: 0.005  # 软更新系数
  train_freq: 1  # 训练频率
  gradient_steps: 1  # 每次收集后的梯度步数

  # 探索配置
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.05
  exploration_fraction: 0.2

  # 目标网络更新
  target_update_interval: 1

  # 策略配置
  policy_kwargs:
    net_arch:
      - 256
      - 256

# 环境配置（会传递给GridDynamicObstacleEnv）
env:
  # 真实数据路径
  map_path: "data/processed/maps/navigation_map.npy"
  trajectory_path: "data/processed/trajectories/multi_obstacles.json"

  # 机器人参数（单位：米）
  robot_radius: 50.0  # 机器人半径50m
  v_max: 20.0  # 最大线速度（米/秒），海船约5-15节(2.5-7.5m/s)
  w_max: 0.1  # 最大角速度（弧度/秒）

  # 动态障碍物参数
  dynamic_obstacle_radius: 50.0  # 船舶半径50m（粗分辨率下可见）

  # 观测参数
  use_local_patch: true
  patch_size: 21  # 21x21像素局部视野，约2.5km x 2.5km范围
  include_dynamic_in_patch: true
  include_nearest_dynamic: true
  nearest_dynamic_k: 3

  # 仿真参数
  dt: 5.0  # 仿真时间步长（秒），AIS原始间隔120s，但RL需要更细粒度
  max_episode_steps: 500  # 5s * 500 = 2500s ≈ 42分钟最大episode

  # 奖励参数
  goal_reward: 100.0
  collision_penalty: -100.0
  step_penalty: -0.1
  progress_weight: 2.0
  safe_distance: 100.0  # 安全距离100m
  safe_distance_penalty: -5.0
